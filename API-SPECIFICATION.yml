openapi: 3.0.3
info:
  title: SkyHigh Core – Digital Check-In System API
  description: |
    REST API for the SkyHigh Airlines digital self-service check-in system.
    Handles seat selection, time-bound holds, baggage validation, payment gating,
    waitlist management, and abuse detection under high-concurrency conditions.

    ## Authentication
    All endpoints (except `/health` and `/metrics`) require a valid JWT in the
    `Authorization: Bearer <token>` header. The JWT is validated but not issued
    by this service (external IdP).

    **JWT Claims:**
    | Claim | Type   | Description        |
    |-------|--------|--------------------|
    | sub   | string | Passenger UUID     |
    | iat   | number | Issued-at (epoch)  |
    | exp   | number | Expiration (epoch) |

    ## Error Format
    All error responses follow the **RFC 7807 Problem Details** specification
    with `Content-Type: application/problem+json`.

    ## Testing
    Comprehensive unit tests cover all services, guards, middleware, and utility
    functions using **Jest** with mocked dependencies. Test naming follows the
    `When_<condition>_Then_<expected>` convention.

    **Unit Test Coverage (23 suites, 255 tests):**

    | Module | Tests | Key Scenarios |
    |--------|-------|---------------|
    | SeatService | 8 | Cache hit/miss, flight 404, cache invalidation |
    | CheckInService | 26 | Seat hold, CAS, already held 409, already checked in 409, hold expired 410, baggage under/over limit, payment success/failure, cancel before/after departure |
    | HoldExpiryService | 17 | Keyspace expiry, CAS release, double-release no-op, waitlist trigger, waitlist entry EXPIRED marking |
    | WaitlistService | 14 | FIFO join, already on waitlist 409, auto-assignment, no waiting passengers, CAS failure, waitlist-assigned hold expiry re-trigger |
    | BaggageService | 10 | Under/over limit fee calc, weight service fallback |
    | PaymentService | 10 | Success, timeout, retry with exponential backoff, non-confirmed status |
    | RateLimiterMiddleware | 11 | Under/at threshold, 429 response, abuse event recording, window reset |
    | JwtAuthGuard | 9 | Valid/expired/missing token, public routes, wrong secret |
    | AuditService | 8 | Fire-and-forget log, transactional log, error handling |
    | AbuseEventService | 7 | Record event, daily cleanup, retention days |
    | NotificationService | 9 | Fire-and-forget HTTP, timeout handling, error logging |
    | Controllers & Others | 126 | Controller delegation, exception filter, health checks, Redis, metrics, logging interceptor |

    Run all unit tests: `npm run test`

    ## Integration Testing
    End-to-end integration tests using **Jest + Testcontainers** with real PostgreSQL
    and Redis instances. Each test suite gets fresh containers for full isolation.
    Requires **Node.js ≥ 20** and **Docker** running locally.

    **Integration Test Coverage (9 suites, 14 tests):**

    | Suite | Tests | Key Scenarios |
    |-------|-------|---------------|
    | Concurrent Seat Hold | 2 | N parallel requests for same seat → exactly one 201, rest 409; different seats succeed concurrently |
    | Hold Expiry | 1 | Seat hold expires → seat released to AVAILABLE, check-in CANCELLED |
    | Full Check-In Flow | 2 | Hold → baggage (under limit) → confirm → COMPLETED; zero baggage confirm |
    | Check-In with Payment | 2 | Overweight baggage → payment triggered → COMPLETED with paymentId; at-limit baggage → no payment |
    | Cancellation | 2 | Cancel confirmed check-in → seat AVAILABLE; cancel triggers waitlist assignment |
    | Waitlist Auto-Assignment | 1 | All seats held → join waitlist → seat expires → waitlisted passenger auto-assigned |
    | Waitlist Hold Expiry | 1 | Waitlist-assigned hold expires → entry EXPIRED → next FIFO passenger gets seat |
    | Rate Limiter | 2 | 55 requests in 2s → 429 response + abuse_event record; under-limit requests succeed |
    | CAS Double-Release | 1 | Both keyspace + sweep fire → only one SEAT_RELEASED audit entry (at-most-once) |

    Run integration tests: `npm run test:integration`

    ## Load Testing (k6)
    Performance load tests using **k6** to validate P95 latency targets under
    simulated peak traffic. Tests run against the Docker Compose environment.

    **Prerequisites:** k6 installed, Docker Compose running, database seeded.

    **Load Test Suites (4 scripts):**

    | Suite | VUs | Duration | P95 Target | Key Scenarios |
    |-------|-----|----------|------------|---------------|
    | Seat Map Retrieval | 500 | 2 min | < 1s | High-concurrency reads against Redis-cached seat map endpoint |
    | Seat Hold Acquisition | 200 | 2 min | < 500ms | Concurrent Redlock-based seat holds with contention (201/409 mix) |
    | End-to-End Check-In | 100 | 2 min | < 5s | Full flow: hold → baggage (under limit) → confirm → cleanup |
    | Abuse Detection | 1 burst + 20 normal | 2 min | N/A | Bot-like burst (>50 req/2s) triggers 429; normal traffic unaffected |

    **Custom k6 Metrics:**

    | Metric | Type | Description |
    |--------|------|-------------|
    | `seat_map_duration` | Trend | Seat map endpoint response time |
    | `seat_map_fail_rate` | Rate | Seat map request failure rate |
    | `seat_hold_duration` | Trend | Seat hold endpoint response time |
    | `seat_hold_contention_rate` | Rate | Seat hold 409 contention rate |
    | `e2e_flow_duration` | Trend | Full check-in flow duration |
    | `hold_step_duration` | Trend | Hold step response time |
    | `confirm_step_duration` | Trend | Confirm step response time |
    | `rate_limited_429_count` | Counter | Number of 429 responses in burst |
    | `rate_limited_triggered` | Rate | Rate of 429 responses in burst scenario |
    | `normal_request_success_rate` | Rate | Success rate for normal-pace traffic |

    Run all load tests: `npm run test:load`
    Run individual: `npm run test:load:seat-map`, `npm run test:load:seat-hold`,
    `npm run test:load:e2e`, `npm run test:load:abuse`
  version: 1.0.0
  contact:
    name: SkyHigh Core Team

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Flights
    description: Read-only flight resources (pre-seeded)
  - name: Seat Map
    description: Seat availability for a flight (cached via Redis)
  - name: Check-In
    description: Seat hold, baggage validation, payment gating, and confirmation
  - name: Waitlist
    description: FIFO waitlist management per flight
  - name: Notifications
    description: Internal notification events sent to the stub Notification Service
  - name: Audit
    description: Append-only audit logging and abuse event recording (internal)
  - name: Metrics
    description: Prometheus metrics endpoint

paths:
  # ──────────────────────────────────────────────
  # Health
  # ──────────────────────────────────────────────
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      description: |
        Liveness and readiness probe. Verifies connectivity to PostgreSQL and Redis.
        This endpoint does **not** require authentication.
      security: []
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
        "503":
          description: One or more dependencies unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"

  # ──────────────────────────────────────────────
  # Metrics
  # ──────────────────────────────────────────────
  /metrics:
    get:
      operationId: getMetrics
      tags: [Metrics]
      summary: Prometheus metrics
      description: |
        Exposes Prometheus-format metrics including default Node.js metrics
        and the following custom business metrics. This endpoint does **not**
        require authentication.

        **Custom Metrics (Technical PRD §10.2):**

        | Metric | Type | Labels | Description |
        |--------|------|--------|-------------|
        | `skyhigh_seat_map_requests_total` | Counter | `flight_id`, `status` | Seat map requests (cache hit/miss) |
        | `skyhigh_seat_hold_duration_seconds` | Histogram | `flight_id` | Time a seat is held before confirm/expiry |
        | `skyhigh_seat_contention_total` | Counter | `flight_id`, `seat_id` | Seat hold contention events |
        | `skyhigh_hold_expiry_total` | Counter | `flight_id`, `mechanism` | Hold expiry events (keyspace/sweep) |
        | `skyhigh_checkin_duration_seconds` | Histogram | `flight_id`, `status` | End-to-end check-in duration |
        | `skyhigh_waitlist_depth` | Gauge | `flight_id` | Current waitlist depth per flight |
        | `skyhigh_waitlist_assignment_total` | Counter | `flight_id` | Waitlist-to-seat assignments |
        | `skyhigh_abuse_events_total` | Counter | `source_ip` | Rate-limit abuse detections |
        | `skyhigh_payment_request_duration_seconds` | Histogram | `status` | Payment service call latency |
        | `skyhigh_http_request_duration_seconds` | Histogram | `method`, `path`, `status` | HTTP request duration |

        **Distributed Tracing (OpenTelemetry):**
        - Auto-instrumented: HTTP requests, TypeORM queries, Redis commands
        - Manual spans: seat hold acquisition, waitlist processing, payment calls
        - Trace context propagated to stub services via `traceparent` header
        - All structured logs include `traceId`, `spanId`, and `requestId` fields
      security: []
      responses:
        "200":
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string

  # ──────────────────────────────────────────────
  # Flights
  # ──────────────────────────────────────────────
  /api/v1/flights:
    get:
      operationId: listFlights
      tags: [Flights]
      summary: List flights with pagination
      description: Returns a paginated list of flights with aircraft type information.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of flights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedFlightsResponse"
              example:
                data:
                  - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    flightNumber: "SH-1042"
                    departureTime: "2026-02-14T10:30:00Z"
                    status: "SCHEDULED"
                    aircraftType:
                      id: "f1e2d3c4-b5a6-7890-fedc-ba0987654321"
                      name: "A320"
                      rows: 30
                      columns: "A,B,C,D,E,F"
                meta:
                  page: 1
                  limit: 10
                  totalItems: 5
                  totalPages: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/flights/{flightId}:
    get:
      operationId: getFlightById
      tags: [Flights]
      summary: Get flight details
      description: Returns a single flight by its UUID including aircraft type information.
      parameters:
        - $ref: "#/components/parameters/FlightIdParam"
      responses:
        "200":
          description: Flight details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FlightNotFound"

  # ──────────────────────────────────────────────
  # Seat Map
  # ──────────────────────────────────────────────
  /api/v1/flights/{flightId}/seats:
    get:
      operationId: getSeatMap
      tags: [Seat Map]
      summary: Get seat map with availability
      description: |
        Returns the full seat map for a flight with real-time availability status.
        This is the most frequently accessed endpoint. Responses are cached in Redis
        with a short TTL (~2s) and invalidated on any seat state change.

        **Rate Limiting:** If a single source IP exceeds 50 requests within a 2-second
        sliding window, a `429 Too Many Requests` response is returned.
      parameters:
        - $ref: "#/components/parameters/FlightIdParam"
      responses:
        "200":
          description: Seat map with availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatMapResponse"
              example:
                flightId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                aircraft: "A320"
                seats:
                  - id: "11111111-1111-1111-1111-111111111111"
                    row: 1
                    column: "A"
                    status: "AVAILABLE"
                  - id: "22222222-2222-2222-2222-222222222222"
                    row: 1
                    column: "B"
                    status: "HELD"
                  - id: "33333333-3333-3333-3333-333333333333"
                    row: 1
                    column: "C"
                    status: "CONFIRMED"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FlightNotFound"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"

  # ──────────────────────────────────────────────
  # Check-In
  # ──────────────────────────────────────────────
  /api/v1/check-ins:
    post:
      operationId: startCheckIn
      tags: [Check-In]
      summary: Start check-in (select seat and hold)
      description: |
        Initiates the check-in process by selecting a seat and placing a time-bound hold.
        The hold lasts **120 seconds**. During this window, the passenger must confirm
        check-in (optionally adding baggage). If the hold expires, the seat is automatically
        released back to the availability pool or assigned to the next waitlisted passenger.

        **Concurrency:** Uses Redis distributed locks (Redlock) and CAS (compare-and-swap)
        pattern to guarantee exactly one passenger holds a seat at any time.

        **Hold Expiry (Automatic):**
        Seat holds are automatically released after 120 seconds via a dual-mechanism system:
        1. **Primary — Redis Keyspace Notifications:** The `hold:{seatId}` Redis key is set
           with a 120s TTL. On expiry, a keyspace notification triggers immediate seat release.
        2. **Fallback — Background Sweep:** A cron job runs every 30 seconds (configurable via
           `SWEEP_INTERVAL_SECONDS`) and queries for any seats where `status = HELD` and
           `held_at + 120s < NOW()`, releasing them if found.

        Both mechanisms use the same CAS (compare-and-swap) release logic to guarantee
        **at-most-once** semantics — a seat is never double-released. On release, the
        associated check-in record transitions to `CANCELLED`, an audit log entry
        (`SEAT_RELEASED`) is created, and the seat map cache is invalidated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCheckInRequest"
            example:
              flightId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              seatId: "11111111-1111-1111-1111-111111111111"
      responses:
        "201":
          description: Check-in started, seat held for 120 seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResponse"
              example:
                id: "cccccccc-cccc-cccc-cccc-cccccccccccc"
                passengerId: "pppppppp-pppp-pppp-pppp-pppppppppppp"
                flightId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                seatId: "11111111-1111-1111-1111-111111111111"
                status: "IN_PROGRESS"
                holdExpiresAt: "2026-02-14T15:20:00Z"
                createdAt: "2026-02-14T15:18:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Flight or seat not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                flightNotFound:
                  summary: Flight does not exist
                  value:
                    type: "https://skyhigh.com/problems/flight-not-found"
                    title: "Flight Not Found"
                    status: 404
                    detail: "Flight with id 'a1b2c3d4-e5f6-7890-abcd-ef1234567890' was not found"
                    instance: "/api/v1/check-ins"
                seatNotFound:
                  summary: Seat does not exist on the flight
                  value:
                    type: "https://skyhigh.com/problems/seat-not-found"
                    title: "Seat Not Found"
                    status: 404
                    detail: "Seat with id '11111111-1111-1111-1111-111111111111' was not found on flight 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'"
                    instance: "/api/v1/check-ins"
        "409":
          description: Seat already held or passenger already checked in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                seatAlreadyHeld:
                  summary: Seat is held by another passenger
                  value:
                    type: "https://skyhigh.com/problems/seat-already-held"
                    title: "Seat Already Held"
                    status: 409
                    detail: "Seat with id '11111111-1111-1111-1111-111111111111' is not available"
                    instance: "/api/v1/check-ins"
                alreadyCheckedIn:
                  summary: Passenger already has an active check-in
                  value:
                    type: "https://skyhigh.com/problems/already-checked-in"
                    title: "Already Checked In"
                    status: 409
                    detail: "Passenger already has an active check-in for this flight."
                    instance: "/api/v1/check-ins"

  /api/v1/check-ins/{checkInId}:
    get:
      operationId: getCheckInStatus
      tags: [Check-In]
      summary: Get check-in status
      description: Returns the current status and details of a check-in record.
      parameters:
        - $ref: "#/components/parameters/CheckInIdParam"
      responses:
        "200":
          description: Check-in details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CheckInNotFound"

    patch:
      operationId: updateCheckIn
      tags: [Check-In]
      summary: Update check-in (add baggage and confirm)
      description: |
        Updates the check-in to add baggage weight and/or confirm.

        **Baggage Validation Flow:**
        1. If `baggageWeight` ≤ 25 kg → check-in is confirmed directly.
        2. If `baggageWeight` > 25 kg:
           - Excess fee is calculated: `(weight - 25) × EXCESS_FEE_PER_KG`.
           - Status transitions to `AWAITING_PAYMENT`.
           - Payment Service is called synchronously.
           - On successful payment → status transitions to `COMPLETED`.
           - On payment failure/timeout → remains `AWAITING_PAYMENT` (passenger can retry).

        The hold timer (120s) continues during this process. If the hold expires before
        confirmation, the check-in fails with `410 Gone`.
      parameters:
        - $ref: "#/components/parameters/CheckInIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCheckInRequest"
            example:
              baggageWeight: 28.5
              action: "CONFIRM"
      responses:
        "200":
          description: Check-in updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResponse"
              examples:
                confirmed:
                  summary: Check-in completed (no excess baggage)
                  value:
                    id: "cccccccc-cccc-cccc-cccc-cccccccccccc"
                    status: "COMPLETED"
                    seatId: "11111111-1111-1111-1111-111111111111"
                    baggageWeight: 20.0
                    excessFee: null
                    confirmedAt: "2026-02-14T15:19:30Z"
                awaitingPayment:
                  summary: Excess baggage fee requires payment
                  value:
                    id: "cccccccc-cccc-cccc-cccc-cccccccccccc"
                    status: "AWAITING_PAYMENT"
                    baggageWeight: 28.5
                    excessFee: 35.00
                    message: "Excess baggage fee of 35.00 must be paid to complete check-in."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CheckInNotFound"
        "410":
          description: Hold has expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://skyhigh.com/problems/hold-expired"
                title: "Hold Expired"
                status: 410
                detail: "The seat hold has expired. Please select a new seat."
                instance: "/api/v1/check-ins/cccccccc-cccc-cccc-cccc-cccccccccccc"

    delete:
      operationId: cancelCheckIn
      tags: [Check-In]
      summary: Cancel check-in
      description: |
        Cancels a confirmed or in-progress check-in. The freed seat is immediately
        made available or assigned to the next waitlisted passenger (FIFO).

        Cancellation is **not allowed** after the flight has departed.
      parameters:
        - $ref: "#/components/parameters/CheckInIdParam"
      responses:
        "200":
          description: Check-in cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInCancelledResponse"
              example:
                id: "cccccccc-cccc-cccc-cccc-cccccccccccc"
                status: "CANCELLED"
                cancelledAt: "2026-02-14T16:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Cancellation not allowed (flight departed)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://skyhigh.com/problems/cancellation-not-allowed"
                title: "Cancellation Not Allowed"
                status: 403
                detail: "Cannot cancel check-in after the flight has departed."
                instance: "/api/v1/check-ins/cccccccc-cccc-cccc-cccc-cccccccccccc"
        "404":
          $ref: "#/components/responses/CheckInNotFound"

  # ──────────────────────────────────────────────
  # Waitlist
  # ──────────────────────────────────────────────
  /api/v1/flights/{flightId}/waitlist:
    post:
      operationId: joinWaitlist
      tags: [Waitlist]
      summary: Join waitlist for a flight
      description: |
        Adds the authenticated passenger to the waitlist for the specified flight.
        Position is assigned in FIFO order. When a seat becomes available (via
        cancellation or hold expiry), the system automatically assigns it to the
        next eligible waitlisted passenger and notifies them.

        The auto-assigned passenger receives a new 120-second hold window. If that
        hold expires, the seat goes back to the waitlist (next FIFO), **not** to
        general availability.
      parameters:
        - $ref: "#/components/parameters/FlightIdParam"
      responses:
        "201":
          description: Successfully joined waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistResponse"
              example:
                id: "wwwwwwww-wwww-wwww-wwww-wwwwwwwwwwww"
                flightId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                passengerId: "pppppppp-pppp-pppp-pppp-pppppppppppp"
                position: 3
                status: "WAITING"
                createdAt: "2026-02-14T15:25:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FlightNotFound"
        "409":
          description: Passenger already on waitlist for this flight
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://skyhigh.com/problems/already-on-waitlist"
                title: "Already On Waitlist"
                status: 409
                detail: "Passenger is already on the waitlist for this flight."
                instance: "/api/v1/flights/a1b2c3d4-e5f6-7890-abcd-ef1234567890/waitlist"

    get:
      operationId: getFlightWaitlist
      tags: [Waitlist]
      summary: Get waitlist status for a flight
      description: Returns the current waitlist entries for a flight ordered by FIFO position.
      parameters:
        - $ref: "#/components/parameters/FlightIdParam"
      responses:
        "200":
          description: Waitlist entries for the flight
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WaitlistResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FlightNotFound"

  /api/v1/waitlist/{waitlistId}:
    delete:
      operationId: leaveWaitlist
      tags: [Waitlist]
      summary: Leave waitlist
      description: Removes the passenger from the waitlist. Only allowed if status is `WAITING`.
      parameters:
        - $ref: "#/components/parameters/WaitlistIdParam"
      responses:
        "200":
          description: Successfully removed from waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistResponse"
              example:
                id: "wwwwwwww-wwww-wwww-wwww-wwwwwwwwwwww"
                flightId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                passengerId: "pppppppp-pppp-pppp-pppp-pppppppppppp"
                position: 3
                status: "CANCELLED"
                createdAt: "2026-02-14T15:25:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/WaitlistNotFound"

# ════════════════════════════════════════════════
# Components
# ════════════════════════════════════════════════
components:
  # ── Security ──────────────────────────────────
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by an external IdP. Claims: `sub` (passenger UUID), `iat`, `exp`.

  # ── Parameters ────────────────────────────────
  parameters:
    FlightIdParam:
      name: flightId
      in: path
      required: true
      description: UUID of the flight
      schema:
        type: string
        format: uuid

    CheckInIdParam:
      name: checkInId
      in: path
      required: true
      description: UUID of the check-in record
      schema:
        type: string
        format: uuid

    WaitlistIdParam:
      name: waitlistId
      in: path
      required: true
      description: UUID of the waitlist entry
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      required: false
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  # ── Schemas ───────────────────────────────────
  schemas:
    # ── Enums ─────────────────────────────────
    FlightStatus:
      type: string
      enum: [SCHEDULED, BOARDING, DEPARTED, CANCELLED]
      description: Current status of a flight

    SeatStatus:
      type: string
      enum: [AVAILABLE, HELD, CONFIRMED, CANCELLED]
      description: |
        Seat lifecycle: AVAILABLE → HELD → CONFIRMED → CANCELLED → AVAILABLE

    CheckInStatus:
      type: string
      enum: [IN_PROGRESS, AWAITING_PAYMENT, COMPLETED, CANCELLED]
      description: Status of a check-in process

    WaitlistStatus:
      type: string
      enum: [WAITING, ASSIGNED, EXPIRED, CANCELLED]
      description: Status of a waitlist entry

    # ── Flight DTOs ───────────────────────────
    AircraftTypeResponse:
      type: object
      required: [id, name, rows, columns]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Aircraft model name (e.g., "A320", "B737")
          example: "A320"
        rows:
          type: integer
          description: Number of seat rows
          example: 30
        columns:
          type: string
          description: Column identifiers as CSV
          example: "A,B,C,D,E,F"

    FlightResponse:
      type: object
      required: [id, flightNumber, departureTime, status, aircraftType]
      properties:
        id:
          type: string
          format: uuid
        flightNumber:
          type: string
          description: Flight number
          example: "SH-1042"
        departureTime:
          type: string
          format: date-time
          description: Scheduled departure time (ISO 8601)
        status:
          $ref: "#/components/schemas/FlightStatus"
        aircraftType:
          $ref: "#/components/schemas/AircraftTypeResponse"

    PaginationMeta:
      type: object
      required: [page, limit, totalItems, totalPages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalItems:
          type: integer
          example: 5
        totalPages:
          type: integer
          example: 1

    PaginatedFlightsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FlightResponse"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    # ── Seat DTOs ─────────────────────────────
    SeatResponse:
      type: object
      required: [id, row, column, status]
      properties:
        id:
          type: string
          format: uuid
        row:
          type: integer
          description: Seat row number (1-based)
          example: 1
        column:
          type: string
          description: Seat column letter
          example: "A"
        status:
          $ref: "#/components/schemas/SeatStatus"

    SeatMapResponse:
      type: object
      required: [flightId, aircraft, seats]
      properties:
        flightId:
          type: string
          format: uuid
        aircraft:
          type: string
          description: Aircraft type name
          example: "A320"
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatResponse"

    # ── Check-In DTOs ─────────────────────────
    StartCheckInRequest:
      type: object
      required: [flightId, seatId]
      properties:
        flightId:
          type: string
          format: uuid
          description: UUID of the flight to check in for
        seatId:
          type: string
          format: uuid
          description: UUID of the seat to hold

    UpdateCheckInRequest:
      type: object
      required: [action]
      properties:
        baggageWeight:
          type: number
          format: double
          description: Baggage weight in kilograms
          example: 28.5
        action:
          type: string
          enum: [CONFIRM]
          description: Action to perform on the check-in

    CheckInResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        passengerId:
          type: string
          format: uuid
        flightId:
          type: string
          format: uuid
        seatId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: "#/components/schemas/CheckInStatus"
        baggageWeight:
          type: number
          format: double
          nullable: true
          description: Baggage weight in kg
        excessFee:
          type: number
          format: double
          nullable: true
          description: Calculated excess baggage fee
        paymentId:
          type: string
          nullable: true
          description: External payment reference ID
        holdExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the seat hold expires (hold start + 120s)
        confirmedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when check-in was confirmed
        message:
          type: string
          nullable: true
          description: Human-readable status message (e.g., payment instructions)
        createdAt:
          type: string
          format: date-time

    CheckInCancelledResponse:
      type: object
      required: [id, status, cancelledAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CANCELLED]
        cancelledAt:
          type: string
          format: date-time

    # ── Baggage & Payment DTOs ─────────────────
    BaggageValidationResult:
      type: object
      description: Result of baggage weight validation and fee calculation
      required: [weight, maxAllowedWeight, isOverweight, excessWeight, excessFee]
      properties:
        weight:
          type: number
          format: double
          description: Declared baggage weight in kg
          example: 28.5
        maxAllowedWeight:
          type: number
          format: double
          description: Maximum allowed baggage weight in kg (configurable via MAX_BAGGAGE_WEIGHT_KG)
          example: 25
        isOverweight:
          type: boolean
          description: Whether the baggage exceeds the maximum allowed weight
          example: true
        excessWeight:
          type: number
          format: double
          description: Weight exceeding the maximum allowed (0 if not overweight)
          example: 3.5
        excessFee:
          type: number
          format: double
          description: "Calculated excess fee: excessWeight × EXCESS_FEE_PER_KG (0 if not overweight)"
          example: 35.00

    PaymentRequest:
      type: object
      description: Request payload sent to the Payment Service
      required: [passengerId, amount, currency, checkInId]
      properties:
        passengerId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          description: Payment amount (excess baggage fee)
          example: 35.00
        currency:
          type: string
          description: ISO 4217 currency code
          example: USD
        checkInId:
          type: string
          format: uuid

    PaymentResult:
      type: object
      description: Result of a payment attempt (never throws on failure)
      required: [success, transactionId, status, errorMessage]
      properties:
        success:
          type: boolean
          description: Whether the payment was confirmed
        transactionId:
          type: string
          nullable: true
          description: External payment reference ID (null on failure)
        status:
          type: string
          description: Payment status (e.g., confirmed, failed, pending)
          example: confirmed
        errorMessage:
          type: string
          nullable: true
          description: Error message on failure (null on success)

    # ── Notification DTOs ────────────────────
    NotificationEventType:
      type: string
      enum: [WAITLIST_SEAT_ASSIGNED, HOLD_EXPIRY_WARNING]
      description: Types of notification events sent to the Notification Service

    NotificationRequest:
      type: object
      description: Request payload sent to the stub Notification Service (fire-and-forget)
      required: [type, passengerId, payload]
      properties:
        type:
          $ref: "#/components/schemas/NotificationEventType"
        passengerId:
          type: string
          format: uuid
          description: UUID of the passenger to notify
        payload:
          type: object
          description: Event-specific payload data
          additionalProperties: true
          properties:
            flightId:
              type: string
              format: uuid
              description: UUID of the flight
            seatId:
              type: string
              format: uuid
              description: UUID of the assigned seat
            waitlistEntryId:
              type: string
              format: uuid
              description: UUID of the waitlist entry

    NotificationResponse:
      type: object
      description: Response from the stub Notification Service
      required: [notificationId, type, passengerId, status, timestamp]
      properties:
        notificationId:
          type: string
          description: Unique notification identifier
          example: "notif_1707912345678"
        type:
          $ref: "#/components/schemas/NotificationEventType"
        passengerId:
          type: string
          format: uuid
        status:
          type: string
          description: Notification acceptance status
          example: "accepted"
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the notification was accepted

    # ── Audit DTOs ───────────────────────────
    AuditAction:
      type: string
      enum:
        - SEAT_HELD
        - SEAT_CONFIRMED
        - SEAT_RELEASED
        - SEAT_CANCELLED
        - WAITLIST_JOINED
        - WAITLIST_ASSIGNED
        - CHECKIN_STARTED
        - CHECKIN_COMPLETED
        - CHECKIN_CANCELLED
        - PAYMENT_REQUESTED
        - PAYMENT_CONFIRMED
        - ABUSE_DETECTED
      description: Type of auditable state transition

    AuditLogEntry:
      type: object
      description: |
        Append-only audit log entry recording a state transition.
        Created by AuditService for every seat, check-in, waitlist, and payment state change.
        Audit logging is non-blocking (fire-and-forget) for non-transactional writes,
        or atomic within the same DB transaction for transactional writes.
      required: [id, entityType, entityId, action, toState, actorId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        entityType:
          type: string
          description: "Type of entity (e.g., seat, check_in, waitlist, payment)"
          example: "seat"
        entityId:
          type: string
          format: uuid
          description: UUID of the entity being audited
        action:
          $ref: "#/components/schemas/AuditAction"
        fromState:
          type: string
          nullable: true
          description: State before the transition (null for initial states)
          example: "AVAILABLE"
        toState:
          type: string
          description: State after the transition
          example: "HELD"
        actorId:
          type: string
          format: uuid
          description: UUID of the actor (passenger or system 00000000-0000-0000-0000-000000000000)
        metadata:
          type: object
          nullable: true
          description: Additional context (flightId, checkInId, seatId, etc.)
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    AbuseEvent:
      type: object
      description: |
        Immutable record of a detected rate-limit abuse event.
        Records older than ABUSE_RETENTION_DAYS (default 90) are cleaned up daily.
      required: [id, sourceIp, requestCount, windowStart, windowEnd, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sourceIp:
          type: string
          description: Source IP address that triggered the abuse detection
          example: "192.168.1.100"
        requestCount:
          type: integer
          description: Number of requests in the sliding window
          example: 55
        windowStart:
          type: string
          format: date-time
          description: Start of the rate-limit sliding window
        windowEnd:
          type: string
          format: date-time
          description: End of the rate-limit sliding window
        details:
          type: object
          nullable: true
          description: Additional context (endpoint, user-agent, etc.)
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    # ── Waitlist DTOs ─────────────────────────
    WaitlistResponse:
      type: object
      required: [id, flightId, passengerId, position, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        flightId:
          type: string
          format: uuid
        passengerId:
          type: string
          format: uuid
        position:
          type: integer
          description: FIFO position in the waitlist (1-based)
          example: 3
        status:
          $ref: "#/components/schemas/WaitlistStatus"
        createdAt:
          type: string
          format: date-time

    # ── Error Schemas ─────────────────────────
    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details error response
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type
          example: "https://skyhigh.com/problems/seat-already-held"
        title:
          type: string
          description: Short human-readable summary of the problem type
          example: "Seat Already Held"
        status:
          type: integer
          description: HTTP status code
          example: 409
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: "Seat 12A on flight SH-1042 is currently held by another passenger."
        instance:
          type: string
          description: URI reference of the specific occurrence (request path)
          example: "/api/v1/check-ins"

    # ── Health Schemas ────────────────────────
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
          description: Overall health status
        info:
          type: object
          description: Healthy dependency details
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [up, down]
        error:
          type: object
          description: Unhealthy dependency details
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [up, down]
        details:
          type: object
          description: Combined dependency details
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [up, down]

  # ── Reusable Responses ────────────────────────
  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://skyhigh.com/problems/bad-request"
            title: "Bad Request"
            status: 400
            detail: "page must not be less than 1"
            instance: "/api/v1/flights"

    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://skyhigh.com/problems/unauthorized"
            title: "Unauthorized"
            status: 401
            detail: "Missing or invalid authentication token."
            instance: "/api/v1/flights"

    FlightNotFound:
      description: Flight not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://skyhigh.com/problems/flight-not-found"
            title: "Flight Not Found"
            status: 404
            detail: "No flight found with the given ID."
            instance: "/api/v1/flights/00000000-0000-0000-0000-000000000000"

    CheckInNotFound:
      description: Check-in not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://skyhigh.com/problems/checkin-not-found"
            title: "Check-In Not Found"
            status: 404
            detail: "No check-in record found with the given ID."
            instance: "/api/v1/check-ins/00000000-0000-0000-0000-000000000000"

    SeatNotFound:
      description: Seat not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://skyhigh.com/problems/seat-not-found"
            title: "Seat Not Found"
            status: 404
            detail: "The requested seat was not found."
            instance: "/api/v1/check-ins"

    WaitlistNotFound:
      description: Waitlist entry not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://skyhigh.com/problems/waitlist-not-found"
            title: "Waitlist Entry Not Found"
            status: 404
            detail: "No waitlist entry found with the given ID."
            instance: "/api/v1/waitlist/00000000-0000-0000-0000-000000000000"

    RateLimitExceeded:
      description: Rate limit exceeded (abuse detection)
      headers:
        Retry-After:
          description: Seconds until the client can retry
          schema:
            type: integer
            example: 2
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://skyhigh.com/problems/rate-limit-exceeded"
            title: "Rate Limit Exceeded"
            status: 429
            detail: "Too many requests. Please wait before retrying."
            instance: "/api/v1/flights/a1b2c3d4-e5f6-7890-abcd-ef1234567890/seats"

# ── Global Security ───────────────────────────
security:
  - BearerAuth: []
